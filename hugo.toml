baseURL = 'https://xenonminer.github.io'
languageCode = 'en-us'
title = 'pwn.land'
enableRobotsTXT = true
summaryLength = 40

[module]
  [module.hugoVersion]
    min = "0.128.0"

[params]
  description = "mov rax, 0xFFFF; pop rdi; ret; pop rsi; ret; syscall"
  # Shown on the home page under the name.
  name = "Jaden Wijata"
  bio = "Pentester, CTF player, and aspiring vulnerability researcher. I play with [Squid Proxy Lovers](https://ctftime.org/team/222966) and write about CTF challenges, certifications, and the tools I build along the way."

  [params.author]
    name = "xenonminer"
    email = "jadenwijata@gmail.com"

  # Rows under the bio on the home page.
  [[params.links]]
    name = "CTF writeups & posts"
    url = "/posts/"
    note = "pwn.land/posts"
  [[params.links]]
    name = "GitHub"
    url = "https://github.com/xenonminer"
    note = "github.com/xenonminer"
  [[params.links]]
    name = "CTFtime"
    url = "https://ctftime.org/team/222966"
    note = "Squid Proxy Lovers"

  # Icon links in the header.
  [params.social]
    github = "https://github.com/xenonminer"
    email = "mailto:jadenwijata@gmail.com"
    discord = "https://discord.com/users/uvuvue"

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 1
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 2
  [[menus.main]]
    name = "Notes"
    pageRef = "/notes"
    weight = 3
  [[menus.main]]
    name = "About"
    pageRef = "/aboutme"
    weight = 4

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark.renderer]
    # Posts use raw <br> and <img> tags.
    unsafe = true
  [markup.highlight]
    noClasses = false
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
